<!--?xml version="1.0" encoding="UTF-8"?-->
<svg width="1200" height="720" viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"></path>
    </marker>
    <style>
      .box { fill:#fff; stroke:#333; stroke-width:2; rx:10; }
      .title { font-weight:700; fill:#111; }
      .body { fill:#444; font-size:13px; }
      .group { fill:#fafafa; stroke:#e5e7eb; stroke-width:1.5; rx:16; }
      .cap { font-size:12px; fill:#666; }
      .tag { fill:#eef2ff; stroke:#c7d2fe; stroke-width:1; rx:6; }
    </style>
  </defs>

  <!-- Backdrop -->
  <rect x="20" y="20" width="1160" height="680" class="group"></rect>
  <text x="600" y="60" text-anchor="middle" font-size="24" class="title">Tabi — System Map</text>

  <!-- Boxes -->
  <!-- Frontend -->
  <rect x="70" y="120" width="300" height="150" class="box"></rect>
  <text x="220" y="150" text-anchor="middle" class="title">Frontend (Next.js)</text>
  <text x="85" y="175" class="body">• Redux • Clerk • Razorpay • GA</text>
  <text x="85" y="195" class="body">• Routes: /api/ingestion-update, /api/process-update</text>

  <!-- int-or -->
  <rect x="450" y="120" width="300" height="150" class="box"></rect>
  <text x="600" y="150" text-anchor="middle" class="title">int-or (Gateway API)</text>
  <text x="465" y="175" class="body">• Auth • Uploads (signed URL) • Orchestration</text>
  <text x="465" y="195" class="body">• Payments • Webhooks to FE • Postgres</text>

  <!-- GCS -->
  <rect x="880" y="120" width="300" height="150" class="box"></rect>
  <text x="1030" y="150" text-anchor="middle" class="title">Google Cloud Storage (GCS)</text>
  <text x="895" y="175" class="body">uploads/ • outputs/ (signed URLs)</text>

  <!-- Ingestion -->
  <rect x="450" y="320" width="300" height="130" class="box"></rect>
  <text x="600" y="345" text-anchor="middle" class="title">ingestion</text>
  <text x="465" y="370" class="body">• Stream CSV from GCS • compute inputIndex</text>
  <text x="465" y="390" class="body">• Write 10-row batches to Mongo</text>

  <!-- Experiment -->
  <rect x="200" y="500" width="300" height="130" class="box"></rect>
  <text x="350" y="525" text-anchor="middle" class="title">experiment (preview)</text>
  <text x="215" y="550" class="body">• Read random batch • OpenAI Assistant</text>
  <text x="215" y="570" class="body">• Return { outputData } + credits</text>

  <!-- Processing -->
  <rect x="680" y="500" width="300" height="130" class="box"></rect>
  <text x="830" y="525" text-anchor="middle" class="title">processing (apply to all)</text>
  <text x="695" y="550" class="body">• Iterate all batches • OpenAI Assistant</text>
  <text x="695" y="570" class="body">• Totals &amp; credits • webhook to int-or</text>

  <!-- Mongo -->
  <rect x="880" y="320" width="300" height="130" class="box"></rect>
  <text x="1030" y="345" text-anchor="middle" class="title">MongoDB (batches)</text>
  <text x="895" y="370" class="body">&lt;userId&gt;.&lt;fileId&gt;.&lt;inputIndex&gt;</text>

  <!-- Postgres -->
  <rect x="70" y="320" width="300" height="130" class="box"></rect>
  <text x="220" y="345" text-anchor="middle" class="title">Postgres (SoR)</text>
  <text x="85" y="370" class="body">users • sessions • files • experiments</text>
  <text x="85" y="390" class="body">projects • credits • payments • logs</text>

  <!-- Assistant -->
  <rect x="1010" y="500" width="170" height="80" class="tag"></rect>
  <text x="1095" y="548" text-anchor="middle" class="body">OpenAI Assistant</text>

  <!-- Arrows -->
  <!-- FE -> int-or -->
  <line x1="370" y1="195" x2="450" y2="195" stroke="#333" stroke-width="2" marker-end="url(#arrow)"></line>
  <!-- int-or -> GCS -->
  <line x1="750" y1="195" x2="880" y2="195" stroke="#333" stroke-width="2" marker-end="url(#arrow)"></line>
  <!-- int-or -> ingestion -->
  <line x1="600" y1="270" x2="600" y2="320" stroke="#333" stroke-width="2" marker-end="url(#arrow)"></line>
  <!-- ingestion -> Mongo -->
  <line x1="750" y1="385" x2="880" y2="385" stroke="#333" stroke-width="2" marker-end="url(#arrow)"></line>
  <!-- int-or -> experiment -->
  <line x1="520" y1="270" x2="350" y2="500" stroke="#333" stroke-width="2" marker-end="url(#arrow)"></line>
  <!-- int-or -> processing -->
  <line x1="680" y1="270" x2="830" y2="500" stroke="#333" stroke-width="2" marker-end="url(#arrow)"></line>
  <!-- experiment -> Mongo -->
  <line x1="500" y1="565" x2="880" y2="385" stroke="#999" stroke-width="2" marker-end="url(#arrow)"></line>
  <!-- processing -> Mongo -->
  <line x1="680" y1="565" x2="880" y2="385" stroke="#999" stroke-width="2" marker-end="url(#arrow)"></line>
  <!-- processing -> Assistant (caption) -->
  <line x1="980" y1="565" x2="1010" y2="540" stroke="#999" stroke-width="2" marker-end="url(#arrow)"></line>
  <!-- experiment -> Assistant (caption) -->
  <line x1="500" y1="540" x2="1010" y2="540" stroke="#ddd" stroke-width="1.5" marker-end="url(#arrow)"></line>
  <!-- int-or -> Postgres -->
  <line x1="450" y1="245" x2="370" y2="320" stroke="#333" stroke-width="2" marker-end="url(#arrow)"></line>
  <!-- processing -> int-or (webhook) -->
  <line x1="830" y1="500" x2="600" y2="270" stroke="#333" stroke-width="2" marker-end="url(#arrow)"></line>
  <!-- GCS uploads note -->
  <text x="1030" y="210" text-anchor="middle" class="cap">PUT via signed URL</text>
</svg>
